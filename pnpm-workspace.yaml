allowBuilds:
  esbuild: true

blockExoticSubs: true

catalog:
  "@hono/node-server": "2.1.7"
  "@hono/zod-validator": "0.9.1"
  "@googleapis/calendar": "20.1.0"
  google-auth-library: "11.3.4"
  "@slack/web-api": "7.9.3"
  "@types/node": "22.15.21"
  date-fns: "4.1.0"
  date-fns-tz: "3.2.0"
  hono: "4.13.18"
  knip: "5.50.0"
  oxfmt: "0.11.0"
  oxlint: "0.16.9"
  tsx: "4.19.4"
  typescript: "5.8.3"
  zod: "3.25.28"

catalogMode: strict

catalogPrune: true

ignoreScripts: true

minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 525600 # 1 year

updateNotifier: false
